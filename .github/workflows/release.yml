name: Release

# Pushing a tag such as v2.0.1 builds the Windows and Linux installers and publishes them
# as a GitHub Release. The tag is the source of truth: its version is written into packages/bruno-electron
# and packages/bruno-app at build time, so no version-bump commit is needed before tagging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v2.0.1)'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is left out until the project has an Apple Developer ID to sign and notarize with.
          - name: Windows
            os: windows-latest
            dist: win
            builder-args: --x64 --publish never
          - name: Linux AppImage
            os: ubuntu-22.04
            dist: linux
            builder-args: --x64 --publish never
          - name: Linux deb
            os: ubuntu-22.04
            dist: deb
            builder-args: --x64 --publish never
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The tag is the source of truth: stamp its version into the packages before building.
      # The installer takes its version from bruno-electron and the interface shows bruno-app's.
      - name: Set the app version from the tag
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $RELEASE_TAG is not a valid version (expected vMAJOR.MINOR.PATCH, optionally with a -prerelease suffix)"
            exit 1
          fi
          for pkg in packages/bruno-electron packages/bruno-app; do
            (cd "$pkg" && npm version "$version" --no-git-tag-version --allow-same-version)
          done

      - name: Setup Node dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Install native modules for every architecture
        shell: bash
        run: node scripts/platform-deps.js

      - name: Build the interface
        shell: bash
        run: npm run build:web

      - name: Package the app
        shell: bash
        env:
          # Nothing is signed yet: stop electron-builder from picking up a random certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/build-electron.js --dist=${{ matrix.dist }} ${{ matrix.builder-args }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-assets
          find packages/bruno-electron/out -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No installers were produced"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.dist }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: installers-*
          merge-multiple: true

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la release-assets
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            prerelease=""
            case "$RELEASE_TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Gruno $RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              $prerelease
          fi
