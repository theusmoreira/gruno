name: Linux Tests

# E2E coverage is tiered to keep pull requests fast:
# - pull requests run the specs for the areas they change plus a smoke set (scripts/select-e2e-tests.js);
# - the nightly schedule and manual runs run the whole suite in 4 shards;
# - pushes to main run only unit and CLI tests, since the nightly run covers the merged code.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *' # 03:17 in Brasília
  push:
    branches: [main, 'release/v*']
    paths-ignore: ['**/*.md', 'docs/**', 'assets/**']
  pull_request:
    branches: [main, 'release/v*']
    paths-ignore: ['**/*.md', 'docs/**', 'assets/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Tests (Linux)
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Run Unit Tests
        uses: ./.github/actions/tests/run-unit-tests

  cli-test:
    name: CLI Tests (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Run CLI Tests
        uses: ./.github/actions/tests/run-cli-tests

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: CLI Test Results (Linux)
          files: |
            packages/bruno-tests/collection/junit.xml
            packages/bruno-tests/safe-mode/junit.xml
          comment_mode: always
          check_run: false

  cli-test-cache-modules:
    name: CLI Tests with experimental-cache-modules (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Run CLI Tests
        uses: ./.github/actions/tests/run-cli-tests
        with:
          experimental_cache_modules: 'true'

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: CLI Test Results with experimental-cache-modules (Linux)
          files: |
            packages/bruno-tests/collection/junit.xml
            packages/bruno-tests/safe-mode/junit.xml
          comment_mode: always
          check_run: false

  e2e-select:
    name: Select E2E Tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.select.outputs.shards }}
      specs: ${{ steps.select.outputs.specs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select specs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ -z "$(git log --since='24 hours ago' --format=%H -1)" ]; then
            echo "No commits in the last 24 hours, skipping the nightly run"
            echo 'shards=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            selection=$(git diff --name-only "$BASE_SHA"...HEAD | node scripts/select-e2e-tests.js)
          else
            selection='{"mode":"full"}'
          fi
          echo "$selection"
          if [ "$(echo "$selection" | jq -r .mode)" = "full" ]; then
            echo 'shards=["1/4","2/4","3/4","4/4"]' >> "$GITHUB_OUTPUT"
            echo 'specs=' >> "$GITHUB_OUTPUT"
          else
            echo 'shards=["1/1"]' >> "$GITHUB_OUTPUT"
            echo "specs=$(echo "$selection" | jq -r '.specs | join(" ")')" >> "$GITHUB_OUTPUT"
          fi

  e2e-test:
    name: Playwright E2E Tests (Linux) ${{ matrix.shard }}
    needs: [e2e-select]
    if: needs.e2e-select.outputs.shards != '[]'
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-select.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install System Dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends install -y \
            libglib2.0-0 libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libasound2t64 \
            xvfb \
            gsettings-desktop-schemas dbus-x11

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Configure Chrome Sandbox
        run: |
          CHROME_SANDBOX="${GITHUB_WORKSPACE}/node_modules/electron/dist/chrome-sandbox"
          if [[ -f "$CHROME_SANDBOX" ]]; then
            sudo chown root "$CHROME_SANDBOX"
            sudo chmod 4755 "$CHROME_SANDBOX"
          fi

      - name: Run E2E Tests
        uses: ./.github/actions/tests/run-e2e-tests
        with:
          os: ubuntu
          shard: ${{ matrix.shard }}
          specs: ${{ needs.e2e-select.outputs.specs }}

      - name: Upload blob report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: blob-report-linux-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 7

  e2e-test-report:
    name: Merge Playwright Reports (Linux)
    if: ${{ !cancelled() && needs.e2e-test.result != 'skipped' }}
    needs: [e2e-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          skip-build: 'true'

      - name: Download blob reports
        uses: actions/download-artifact@v6
        with:
          path: all-blob-reports
          pattern: blob-report-linux-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --config=playwright.merge.config.ts ./all-blob-reports

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-linux
          path: playwright-report/
          retention-days: 30

  ssl-test:
    name: SSL Tests (Linux)
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Setup Feature Dependencies
        uses: ./.github/actions/ssl/linux/setup-feature-specific-deps

      - name: Setup CA Certificates
        uses: ./.github/actions/ssl/linux/setup-ca-certs

      - name: Setup Client Certificates
        uses: ./.github/actions/ssl/linux/setup-client-certs

      - name: Run Basic SSL CLI Tests
        uses: ./.github/actions/ssl/linux/run-basic-ssl-cli-tests

      - name: Run Custom CA Certs CLI Tests
        uses: ./.github/actions/ssl/linux/run-custom-ca-certs-cli-tests

      - name: Run Client Certs CLI Tests
        uses: ./.github/actions/ssl/linux/run-client-certs-cli-tests

      - name: Run Custom CA Certs E2E Tests
        uses: ./.github/actions/ssl/linux/run-ssl-e2e-tests

  oauth1-tests:
    name: OAuth 1.0 Auth Tests (Linux)
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Setup Feature Dependencies
        uses: ./.github/actions/auth/oauth1/linux/setup-feature-specific-deps

      - name: Run Auth E2E Tests
        uses: ./.github/actions/auth/oauth1/linux/run-auth-e2e-tests

      - name: Start Test Server
        uses: ./.github/actions/auth/oauth1/linux/start-test-server

      - name: Run OAuth1 CLI Tests
        uses: ./.github/actions/auth/oauth1/linux/run-oauth1-cli-tests