name: 'Run E2E Tests'
description: 'Setup dependencies, configure environment, and run Playwright E2E tests'
inputs:
  os:
    description: 'Operating system (ubuntu, macos, windows)'
    default: 'ubuntu'
  shell:
    description: 'Shell to use (bash, pwsh)'
    required: false
    default: 'bash'
  shard:
    description: 'Optional Playwright shard, e.g. 1/4'
    required: false
    default: ''
  specs:
    description: 'Optional space-separated spec files or directories to run instead of the whole suite (bash shells only)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install Test Collection Dependencies
      shell: ${{ inputs.shell }}
      run: npm ci --prefix packages/bruno-tests/collection

    - name: Run Playwright Tests (Ubuntu)
      if: inputs.os == 'ubuntu' && inputs.shard == ''
      shell: bash
      env:
        E2E_SPECS: ${{ inputs.specs }}
      run: xvfb-run dbus-run-session -- npm run test:e2e -- $E2E_SPECS

    - name: Run Playwright Tests (Ubuntu, sharded)
      if: inputs.os == 'ubuntu' && inputs.shard != ''
      shell: bash
      env:
        E2E_SPECS: ${{ inputs.specs }}
      run: xvfb-run dbus-run-session -- npm run test:e2e -- --shard=${{ inputs.shard }} $E2E_SPECS

    - name: Run Playwright Tests
      if: inputs.os != 'ubuntu' && inputs.shard == ''
      shell: ${{ inputs.shell }}
      env:
        E2E_SPECS: ${{ inputs.specs }}
      run: npm run test:e2e -- $E2E_SPECS

    - name: Run Playwright Tests (sharded)
      if: inputs.os != 'ubuntu' && inputs.shard != ''
      shell: ${{ inputs.shell }}
      env:
        E2E_SPECS: ${{ inputs.specs }}
      run: npm run test:e2e -- --shard=${{ inputs.shard }} $E2E_SPECS
